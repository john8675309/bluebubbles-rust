[package]
name = "bluebubbles-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "A lightweight Rust client for BlueBubbles"
repository = "https://github.com/john8675309/bluebubbles-rust"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rfd = "0.15"
rust_socketio = "0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
fcm-push-listener = "=4.1.1"
fcm-http = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-util"] }
tokio-stream = "0.1"
notify-rust = "4"
ksni = { version = "=0.3.6", features = ["blocking"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
prost = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libloading = "0.8"
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
